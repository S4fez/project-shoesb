<nav class="court-nav" [class.hidden]="!isLoggedIn()">
  <div class="nav-inner">
    <!-- Logo -->
    <a routerLink="/home" class="nav-logo">
      <div class="logo-circle">SB</div>
      <div class="logo-text">
        <span class="logo-main">SHOESBASKETBALL</span>
        <span class="logo-reg">®</span>
      </div>
    </a>

    <!-- Nav tabs -->
    <ul class="nav-tabs-list">
      <li *ngFor="let item of navItems">
        <a [routerLink]="item.route" class="nav-tab" [class.active]="isActive(item.route)">{{ item.label }}</a>
      </li>
    </ul>

    <!-- Right side -->
    <div class="nav-right">
      <!-- Search -->
      <div class="search-bar">
        <input type="text" [(ngModel)]="searchQuery" (keyup.enter)="onSearch()" placeholder="Search shoes...">
        <button (click)="onSearch()" class="search-btn"><i class="fas fa-search"></i></button>
      </div>

      <!-- Wishlist -->
      <a routerLink="/wishlist" class="icon-btn">
        <i class="fas fa-heart"></i>
        <span class="icon-badge" *ngIf="wishlistCount > 0">{{ wishlistCount }}</span>
      </a>

      <!-- Cart -->
      <a routerLink="/cart" class="icon-btn">
        <i class="fas fa-shopping-bag"></i>
        <span class="icon-badge" *ngIf="cartCount > 0">{{ cartCount }}</span>
      </a>

      <!-- Profile -->
      <a routerLink="/profile" class="icon-btn">
        <i class="fas fa-user-circle"></i>
      </a>

      <!-- Logout -->
      <button class="logout-btn" (click)="logout()" *ngIf="isLoggedIn()">
        <i class="fas fa-sign-out-alt"></i>
      </button>
    </div>
  </div>
</nav>
