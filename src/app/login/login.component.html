<section class="login">
  <div class="login__left">
    <img [src]="'https://images.unsplash.com/photo-1552346154-21d32810aba3?w=1600&q=80'" alt="" class="login__hero-img" />
    <div class="login__overlay"></div>
    <svg class="login__lines" viewBox="0 0 800 450" preserveAspectRatio="xMidYMid slice">
      <g fill="none" stroke="#FF5C1A" stroke-width="1.5" opacity="0.1">
        <rect x="40" y="40" width="720" height="370"/>
        <line x1="400" y1="40" x2="400" y2="410"/>
        <circle cx="400" cy="225" r="60"/>
      </g>
    </svg>
    <div class="login__left-text">
      <div class="eyebrow-sm">JOIN THE CLUB</div>
      <h2 class="login__tagline">STEP<br>ON<br>THE <span class="orange">COURT</span>.</h2>
    </div>
  </div>

  <div class="login__form">
    <div class="eyebrow-sm">ACCOUNT / SIGN IN</div>
    <h1 class="login__title">WELCOME BACK.</h1>

    <div *ngIf="error" class="login__error">{{ error }}</div>

    <div class="field">
      <label class="field__label">USERNAME</label>
      <input [(ngModel)]="username" placeholder="your_username" class="field__input" />
    </div>
    <div class="field">
      <label class="field__label">PASSWORD</label>
      <input [(ngModel)]="password" type="password" placeholder="••••••••" class="field__input" />
    </div>

    <div class="login__meta">
      <label class="login__remember">
        <input type="checkbox" [(ngModel)]="rememberMe" />
        REMEMBER ME
      </label>
      <button class="btn-link">FORGOT PASSWORD?</button>
    </div>

    <button class="btn-primary login__submit" (click)="onLogin()" [disabled]="loading">
      {{ loading ? 'SIGNING IN...' : 'เข้าสู่ระบบ · SIGN IN →' }}
    </button>

    <div class="login__divider"><span></span>OR<span></span></div>

    <div class="login__social">
      <button class="btn-ghost">GOOGLE</button>
      <button class="btn-ghost">APPLE</button>
    </div>

    <p class="login__register">
      NEW HERE? <button class="btn-link orange-link">สมัครสมาชิก · CREATE ACCOUNT →</button>
    </p>
  </div>
</section>
