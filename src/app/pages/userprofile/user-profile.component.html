<div class="profile">
  <section class="profile__body">
    <!-- Sidebar -->
    <aside class="profile__sidebar">
      <div class="user-card">
        <div class="user-avatar">{{ avatarInitials }}</div>
        <div>
          <div class="user-name">{{ displayName }}</div>
          <div class="user-email">{{ email || '—' }}</div>
        </div>
      </div>
      <div class="user-stats">
        <div *ngFor="let s of stats" class="stat-cell">
          <div class="stat-label">{{s[0]}}</div>
          <div class="stat-val">{{s[1]}}</div>
        </div>
      </div>
      <nav class="profile__nav">
        <button *ngFor="let n of navItems" class="profile__nav-item" [class.active]="n[2]" (click)="navClick(n[0])">
          <span class="nav-icon">{{n[1]}}</span> {{n[0]}}
        </button>
        <button class="profile__nav-item signout" (click)="logout()">← SIGN OUT</button>
      </nav>
    </aside>

    <!-- Main -->
    <main class="profile__main">
      <div class="eyebrow-sm">ACCOUNT / DETAILS</div>
      <h1 class="profile__title">MY ACCOUNT.</h1>

      <div class="orders-section">
        <div class="orders-header">
          <h3 class="orders-title">RECENT ACTIVITY</h3>
          <button class="btn-link" (click)="goTracking()">TRACKING →</button>
        </div>
        <div class="orders-table">
          <div class="order-row first">
            <span class="order-no">WISHLIST</span>
            <span class="order-qty">{{ wishlist.count }} ITEMS</span>
            <span class="order-total">—</span>
            <span class="order-status" [style.color]="'var(--court-orange)'">● SAVED</span>
            <a routerLink="/wishlist" class="order-arrow">→</a>
          </div>
          <div class="order-row">
            <span class="order-no">CART</span>
            <span class="order-qty">{{ cart.count }} ITEMS</span>
            <span class="order-total">฿{{ cart.total.toLocaleString() }}</span>
            <span class="order-status" [style.color]="'var(--court-mute)'">● PENDING</span>
            <a routerLink="/cart" class="order-arrow">→</a>
          </div>
        </div>
      </div>

      <h3 class="section-heading">PERSONAL DETAILS</h3>
      <div class="form-grid">
        <div class="field"><label class="field__label">FIRST NAME</label><input [(ngModel)]="firstName" placeholder="Supachai" class="field__input" /></div>
        <div class="field"><label class="field__label">LAST NAME</label><input [(ngModel)]="lastName" placeholder="Kanchanasut" class="field__input" /></div>
        <div class="field"><label class="field__label">EMAIL</label><input [(ngModel)]="email" placeholder="supachai@court.com" class="field__input" /></div>
        <div class="field"><label class="field__label">PHONE</label><input [(ngModel)]="phone" placeholder="+66 81 234 5678" class="field__input" /></div>
        <div class="field"><label class="field__label">DEFAULT SHOE SIZE</label><input [(ngModel)]="size" placeholder="US 10" class="field__input" /></div>
        <div class="field"><label class="field__label">BIRTHDAY</label><input [(ngModel)]="birthday" placeholder="MM / DD / YYYY" class="field__input" /></div>
      </div>
      <div class="form-actions">
        <button class="btn-primary" (click)="saveChanges()">SAVE CHANGES</button>
        <button class="btn-ghost">CANCEL</button>
      </div>
    </main>
  </section>
</div>
