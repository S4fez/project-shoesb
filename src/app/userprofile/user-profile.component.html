<app-navbar></app-navbar>
<div class="profile-container">
    <div class="profile-card">
        <div class="profile-header">
            <img src="{{ baseApiUrl + profile?.user_img }}" alt="" class="profile-avatar" />
            <h2 class="profile-name">{{ profile?.name }} {{ profile?.surname }}</h2>
            <p class="profile-email">{{ profile?.email }}</p>
            <!-- ปุ่มเปิด popup -->
            <button class="show-btn" (click)="ShowUploadPopup()">Upload</button>

            <!-- popup overlay -->
            <div class="popup-overlay" *ngIf="ShowPopup">
                <div class="popup-content">
                    <span class="close" (click)="CloseUploadPopup()">&times;</span>

                    <div class="upload-container">
                        <div class="file-upload">
                            <input type="file" id="fileInput" (change)="onFileSelected($event)" />
                            <label for="fileInput" class="custom-file-btn">
                                Choose File
                            </label>
                            <span class="file-name">{{ selectedFileName || 'No file chosen' }}</span>
                        </div>


                        <div *ngIf="previewUrl" class="preview">
                            <img [src]="previewUrl" alt="preview" />
                        </div>

                        <button class="upload-btn" (click)="onUpload()">Upload</button>
                    </div>
                </div>
            </div>

        </div>

        <div class="profile-details">
            <div class="detail-item">
                <span class="label">📍 Address:</span>
                <span class="value">{{ profile?.address }}</span>
            </div>

            <div class="detail-item">
                <span class="label">🎂 Age:</span>
                <span class="value">{{ profile?.user_age }}</span>
            </div>

            <div class="detail-item">
                <span class="label">🗓️ Birthdate:</span>
                <span class="value">{{ profile?.user_birthdate | date }}</span>
            </div>
        </div>
    </div>
    <div class="profile-card">
        <div class="profile-header">
            <h2 class="profile-sys">{{ profile?.sysname }}</h2>
            <p class="profile-Role">{{ profile?.rolename }}</p>
        </div>

        <!-- เมนู Admin/Staff เท่านั้น -->
        <div class="menu-group" *ngIf="isAdmin() || isStaff()">
            <button class="menu-button" routerLink="/admin/products">
                <i class="fas fa-tags me-2"></i>เพิ่มสินค้า
            </button>
            <button class="menu-button" routerLink="/admin/users" *ngIf="isAdmin()">
                <i class="fas fa-users me-2"></i>บทบาท
            </button>
            <button class="menu-button" routerLink="/admin/orders">
                <i class="fas fa-shopping-bag me-2"></i>คำสั่งซื้อ
            </button>
        </div>

        <!-- ปุ่ม Logout ทุก role เห็น -->
        <div class="menu-group">
            <button class="menu-button logout-btn" (click)="logout()">
                <i class="fas fa-sign-out-alt me-2"></i>ออกจากระบบ
            </button>
        </div>
    </div>
</div>
